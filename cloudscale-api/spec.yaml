schemaVersion: "2"
kind: mixin
name: cloudscale-api
displayName: Cloudscale API
description: Grants sandbox access to api.cloudscale.ch with credential injection

permissions:
  network:
    allow:
      - "api.cloudscale.ch"

credentials:
  - service: cloudscale
    description: cloudscale API token
    apiKey:
      name: CLOUDSCALE_API_TOKEN
      inject:
        - domain: api.cloudscale.ch
          header: Authorization
          format: "Bearer %s"
