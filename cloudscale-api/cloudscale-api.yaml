# syntax=docker/sandbox-kit:3
# A declaration-only mixin: it contributes egress and a credential and ships no
# content, so there is no cloudscale-api.dockerfile beside it.
schemaVersion: "3"
kind: mixin
displayName: Cloudscale API
description: Grants sandbox access to api.cloudscale.ch with credential injection

capabilities:
  # An absent phase grants nothing. The kit has no hooks, so nothing runs at
  # install; the host is reached only by the agent at steady state, so it is
  # `runtime` only. Written portless, which matches any port.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.cloudscale.ch

  # `optional: true`: an entry is required unless it opts out, and a sandbox
  # with no cloudscale secret bound is a normal configuration (the agent just
  # cannot reach the API authenticated), so it must not refuse the create.
  #
  # The service name is load-bearing: it is the key the host binds the secret
  # under (`sbx secret set cloudscale`). Renaming it detaches the binding.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: cloudscale API token
    config:
      service: cloudscale
      phase: runtime
      apiKey:
        name: CLOUDSCALE_API_TOKEN
        # Sets CLOUDSCALE_API_TOKEN to the `proxy-managed` sentinel inside the
        # sandbox, so tools that refuse to start without the variable work,
        # while the real value never enters the container.
        proxyManaged: true
        # The inject domain is in this phase's allow list above, which
        # validation requires as an exact host match.
        inject:
          - {domain: api.cloudscale.ch, header: Authorization, format: "Bearer %s"}
