# Kit tests for the v3 kits in this repository.
#
# Adapted from docker/sbx-kits-contrib@7f8518ce98d439a35096ff7f6d00e9b8f65b0f53
# .github/workflows/tck.yml (Apache-2.0); license text in scripts/LICENSE-APACHE,
# changes listed in scripts/NOTICE.md.
#
#   test-kit   The gate. Builds every kit with the v3 kit frontend (which is
#              what validates the descriptor) and lints it, via the same
#              scripts/test-kit.sh authors run locally.
#
# There is no smoke/e2e job and no `sbx kit inspect` job: both need a real
# sbx daemon backed by a sandbox runtime, which needs /dev/kvm. GitHub-hosted
# runners don't expose it, so those checks stay manual and local
# (`scripts/test-kit.sh --inspect`, `sbx run`; see README).
name: Kit tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch drift in the floating base images, the upstream
  # installers the kits call, and the sbx CLI itself.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  list-kits:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/discover-kits.sh is the single definition of what a kit is:
      # a directory holding <dir>/<dir>.yaml.
      - name: List kits
        id: list
        run: |
          kits=$(./scripts/discover-kits.sh | jq -R . | jq -sc .)
          echo "kits=${kits:-[]}" >> "$GITHUB_OUTPUT"
          echo "Detected kits: $kits"

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse-check and shellcheck scripts
        run: |
          for script in scripts/*.sh; do
            echo "==> ${script}"
            bash -n "$script"
          done
          shellcheck scripts/*.sh

  test-kit:
    needs: list-kits
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.list-kits.outputs.kits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A current BuildKit for the `# syntax=docker/sandbox-kit:3` frontend.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install yamllint
        run: |
          uv tool install yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # matrix.kit is a directory name from the checkout; passed via env so a
      # name with shell metacharacters cannot inject commands.
      - name: Build and lint ${{ matrix.kit }}
        env:
          KIT: ${{ matrix.kit }}
        run: ./scripts/test-kit.sh "$KIT"
