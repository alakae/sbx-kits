# Adapted from docker/sbx-kits-contrib@b47f8d5 .github/workflows/tck.yml
# (Apache-2.0); license text in scripts/LICENSE-APACHE, changes listed in
# scripts/NOTICE.md. Only the test-kit job is carried over; kits are listed by
# list-kits, which tests every kit, instead of contrib's detect-changes. The
# conformance gate, test-tck, test-scripts and e2e jobs are left out (no
# branch protection, no Go packages, no /dev/kvm on GitHub-hosted runners).
# Linting lives in lint.yml.
name: Kit TCK

# Conformance testing for v3 kits.
#
#   test-kit    Builds each kit into an OCI layout and judges that
#               artifact with `kit-tck`, the conformance suite that ships with
#               the specification. Conformance in v3 is a property of the
#               published artifact — its annotations, layers, staged sources and
#               image config — so it can only be checked on something built. The
#               layout form needs no registry and no push, which is what makes it
#               runnable on a PR.
#
# There is deliberately NO separate descriptor-validation job. The kit frontend
# validates the descriptor during the build and fails the build on a bad one, so
# every build is already a descriptor check.

on:
  push:
    branches: [main, v3]
  pull_request:
  # alakae/sbx-kits addition: weekly, to catch drift in the floating base
  # images and upstream installers the kits build from, and new kit-tck checks.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  list-kits:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List kits
        id: list
        run: |
          # Status checked before the pipe: GitHub runs `run:` under
          # `bash -e` with NO pipefail, so jq succeeding would mask
          # discover-kits.sh refusing the layout and yield `[]`.
          if ! discovered=$(./scripts/discover-kits.sh); then
            echo "::error::discover-kits.sh refused the kit layout; see its output above."
            exit 1
          fi
          kits=$(printf '%s' "$discovered" | jq -R . | jq -sc .)

          echo "kits=${kits:-[]}" >> "$GITHUB_OUTPUT"
          echo "Detected kits to test: $kits"

  test-kit:
    needs: list-kits
    if: >-
      needs.list-kits.outputs.kits != '[]' &&
      needs.list-kits.outputs.kits != 'null' &&
      needs.list-kits.outputs.kits != ''
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.list-kits.outputs.kits) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The OCI exporter (`--output type=oci`) is not available on the default
      # `docker` driver builder a runner comes with, so the conformance build
      # needs a real builder instance.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # kit-tck ships with the specification, not with this repository, so the
      # checks and the clauses they enforce version together.
      #
      # INSTALLED FROM THE RELEASE ASSET, not `go install`. The spec publishes a
      # kit-tck binary per platform on every tag, and reaching for `go install
      # <pkg>@latest` instead walked into two unrelated walls at once:
      #
      #   1. A toolchain floor. setup-go installs the version from OUR go.mod
      #      and pins GOTOOLCHAIN=local, so the install died the moment the
      #      spec's own floor moved past ours:
      #        sandbox-kit-spec/v3@v3.0.0-m.8 requires go >= 1.26.8
      #        (running go 1.26.2; GOTOOLCHAIN=local)
      #      kit-tck is a TOOL, so the toolchain it needs is the spec's, not
      #      this module's -- raising our own floor to satisfy it would move it
      #      for everyone who imports us.
      #   2. `go install pkg@version` REFUSES any module whose go.mod carries a
      #      replace directive, and the spec gained one at v3.0.0-m.7
      #      (cilium/ebpf). No toolchain setting gets past that, so the Go path
      #      was a dead end from m.7 onward however it was configured.
      #
      # The published binary has neither problem, needs no Go at all (which is
      # why the setup-go step that stood here is gone -- nothing else in this
      # job uses Go), and is checksum-verified below.
      - name: Install kit-tck
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo=docker/sandbox-kit-spec

          # Newest v3 release, PRERELEASES INCLUDED. The v3 line is a milestone
          # series and nothing in it is flagged "latest", so `gh release
          # download` with no tag (which implies --latest) resolves to nothing.
          # Taking the newest entry keeps the "track the spec" intent the
          # `@latest` install had: kit-tck gains checks as the specification
          # does, and pinning here would quietly stop enforcing new clauses.
          #
          # --exclude-drafts, and the v3 filter rather than a bare --limit 1:
          # the newest release overall is not necessarily one this consumes. A
          # draft, or a tag from another series, would resolve here and then
          # match no asset below.
          #
          # The listing is run on its own line rather than inside the
          # assignment because `tag=$(gh …)` under `set -e` aborts the step on
          # a non-zero exit, so an auth failure would die with no diagnostic at
          # all -- which is the one thing the `go install` block this replaced
          # did tell you. Empty output and a failed call are different
          # answers and are reported as such.
          # The listing is retried for the same reason as the download below:
          # the GitHub API fails transiently often enough across the matrix.
          n=0
          until releases=$(gh release list --repo "$repo" --exclude-drafts \
                             --limit 20 --json tagName 2>&1); do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              echo "::error::Could not list releases in ${repo} after ${n} attempts." \
                   "Either the API is failing or this runner's token cannot read it." \
                   "gh said: ${releases}"
              exit 1
            fi
            echo "release listing failed (attempt $n), retrying in $((n * 15))s" >&2
            sleep $((n * 15))
          done
          tag=$(printf '%s' "$releases" | jq -r '[.[].tagName | select(startswith("v3."))][0] // ""')
          if [ -z "$tag" ]; then
            echo "::error::${repo} is readable but publishes no v3.* release," \
                 "so there is no kit-tck build to install."
            exit 1
          fi

          case "$(uname -m)" in
            x86_64)        arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          asset="kit-tck_${tag#v}_linux_${arch}.tar.gz"

          dir="${RUNNER_TEMP}/kit-tck"
          mkdir -p "$dir"
          # The GitHub API answers 5xx often enough across a 98-job matrix to
          # red a run on its own, so the download retries before giving up.
          n=0
          until gh release download "$tag" --repo "$repo" \
                  --pattern "$asset" --pattern checksums.txt --dir "$dir" --clobber; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              echo "::error::could not download ${asset} from ${tag} after ${n} attempts." \
                   "Either the API is failing (see above) or the release was just cut" \
                   "and its archives are still uploading; re-run shortly."
              exit 1
            fi
            echo "download failed (attempt $n), retrying in $((n * 15))s" >&2
            sleep $((n * 15))
          done

          # --ignore-missing: checksums.txt covers every platform's asset and we
          # downloaded one. Without it sha256sum fails on the absent entries.
          ( cd "$dir" && sha256sum --ignore-missing --check checksums.txt )

          tar xzf "${dir}/${asset}" -C "$dir" kit-tck
          echo "$dir" >> "$GITHUB_PATH"
          # Recording the version it resolved to makes a check that appeared
          # between two runs explainable from the log.
          "${dir}/kit-tck" version
      # matrix.kit comes from directory names in the PR's own checkout
      # (discover-kits.sh); passed via env rather than interpolated into the
      # script text so a directory name containing shell metacharacters can't
      # inject commands.
      - name: Conformance-check ${{ matrix.kit }}
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          KIT: ${{ matrix.kit }}
        # Invoke the same wrapper kit authors use locally so CI and the local
        # workflow stay 1:1. `-v` lists the checks that passed, so the log records
        # what was actually enforced rather than only a count.
        #
        # A WARNED check is not a failure and the script does not treat it as one.
        # A multi-node builder merges per-node results into a fresh index, which
        # drops the kit annotations from the index level; SPEC-v3 §9.3 says
        # consumers fall back to the platform manifest, which still carries them.
        # Expect that warning here whenever the builder has more than one node.
        run: ./scripts/test-kit.sh "$KIT" -v

      # A fork PR's token cannot read the private spec repository, so kit-tck
      # cannot be installed there and full conformance cannot run. Rather than
      # leave a fork with no feedback at all, build the descriptor and throw the
      # result away: the frontend validates during the build and fails it, so this
      # still catches every invalid descriptor — just not the artifact-shape
      # checks. If docker/sandbox-kit-spec ever becomes public, delete this step
      # and the three `if:` guards above.
      - name: Validate descriptor for ${{ matrix.kit }} (fork PR)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          KIT: ${{ matrix.kit }}
        run: |
          echo "::notice::Fork PR — running descriptor validation only." \
               "Full conformance needs kit-tck from the private spec repository."
          ./scripts/test-kit.sh --validate-only "$KIT"
