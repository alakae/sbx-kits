schemaVersion: "2"
kind: sandbox
name: junie-local
displayName: Junie Local (MLX)
description: >-
  Junie wired to the junie-mlx-vlm engine running on the host. Junie is baked
  into the image at build time, so no cloud model provider is reachable and
  nothing is fetched at sandbox creation.

sandbox:
  # Built from the Dockerfile here (see README.md) — never pushed, since it
  # bundles JetBrains' proprietary Junie build.
  image: junie-local-image:latest
  entrypoint:
    - junie
    - --model
    - custom:local-qwen3.6-27b-4bit

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment

    You are running inside a Docker sandbox. The only reachable host is the
    local inference engine at http://host.docker.internal:19239 — no cloud LLM
    provider, package registry, or git forge is reachable. Do not suggest
    commands that require network access. The workspace is mounted at its
    absolute host path.

permissions:
  network:
    # Translated address: the proxy maps host.docker.internal -> localhost,
    # so this differs from the host.docker.internal used in the model profile below.
    allow:
      - localhost:19239

credentials:
  # Token from install.sh's server-config.json.
  - service: junie-local
    description: Bearer token from ~/.local/share/junie-local/server-config.json
    required: true
    apiKey:
      name: JUNIE_LOCAL_API_KEY
      inject:
        - domain: localhost:19239
          header: Authorization
          format: "Bearer %s"

environment:
  variables:
    # Stops the shim from self-updating mid-session (would reach
    # junie.jetbrains.com/github.com — see AutoUpdateService in the shim source).
    JUNIE_SKIP_UPDATE_CHECK: "1"

setup:
  files:
    # Mirrors the host profile from install.sh, with localhost swapped for
    # host.docker.internal and the token replaced by the proxy sentinel.
    - path: /home/agent/.junie/models/local-qwen3.6-27b-4bit.json
      mode: "0600"
      description: Junie custom-model profile pointing at the host engine
      content: |
        {
          "displayName": "Qwen 3.6",
          "providerName": "Local",
          "id": "Qwen3.6-27B-MLX-4bit",
          "baseUrl": "http://host.docker.internal:19239/v1/chat/completions",
          "apiType": "OpenAICompletion",
          "apiKey": "proxy-managed",
          "temperature": 0.6,
          "maxContextLength": 150000,
          "extraBody": {
            "enable_thinking": false
          }
        }
